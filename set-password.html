<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Admin Password | Dr Mansoor Clinics</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8">
    <p class="text-xs uppercase tracking-widest font-bold text-teal-700">Dr Mansoor Clinics</p>
    <h1 class="text-2xl font-bold mt-2">Set your admin password</h1>
    <p class="text-sm text-slate-500 mt-2">Use this page after accepting your invitation, or request a secure password-reset email.</p>

    <section id="activeSession" class="hidden mt-6">
      <p id="sessionInfo" class="text-sm text-emerald-700 mb-4">Your account session is verified.</p>
      <form id="passwordForm" class="space-y-4">
        <label class="block text-sm font-semibold">New password
          <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2">
        </label>
        <label class="block text-sm font-semibold">Confirm new password
          <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2">
        </label>
        <button id="savePassword" class="w-full bg-teal-700 hover:bg-teal-800 text-white rounded-lg py-3 font-bold">Save password</button>
      </form>
    </section>

    <section id="requestReset" class="hidden mt-6">
      <form id="resetForm" class="space-y-4">
        <label class="block text-sm font-semibold">Admin email
          <input id="email" type="email" autocomplete="email" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" placeholder="Enter invited email">
        </label>
        <button id="sendReset" class="w-full bg-teal-700 hover:bg-teal-800 text-white rounded-lg px-4 py-3 font-bold">Send password setup link</button>
      </form>
    </section>

    <p id="status" role="status" aria-live="polite" class="text-sm mt-4"></p>
    <p class="text-sm mt-6"><a href="./admin.html" class="text-teal-700 font-semibold hover:underline">← Back to Clinic Admin Login</a></p>
  </main>
<script>
(function(){
  const cfg=window.SUPABASE_CONFIG;
  const ready=window.supabase&&cfg&&cfg.url&&cfg.anonKey&&!cfg.url.includes('YOUR_PROJECT')&&!cfg.anonKey.includes('YOUR_SUPABASE');
  const client=ready?window.supabase.createClient(cfg.url,cfg.anonKey):null;
  const $=id=>document.getElementById(id);
  function status(message,error){
    $('status').textContent=message||'';
    $('status').className='text-sm mt-4 '+(error?'text-rose-700':'text-emerald-700');
  }
  function showPasswordForm(session){
    if(!session||!session.user)return;
    $('activeSession').classList.remove('hidden');
    $('requestReset').classList.add('hidden');
    $('sessionInfo').textContent='Verified account: '+(session.user.email||'admin');
  }
  async function initialise(){
    if(!client){status('Supabase configuration is missing. Please contact the website administrator.',true);return;}
    const params=new URLSearchParams(location.search);
    if(params.get('email'))$('email').value=params.get('email');
    const {data,error}=await client.auth.getSession();
    if(error){status(error.message,true);$('requestReset').classList.remove('hidden');return;}
    if(data.session)showPasswordForm(data.session);
    else $('requestReset').classList.remove('hidden');
  }
  $('resetForm').addEventListener('submit',async e=>{
    e.preventDefault();
    if(!client)return;
    const button=$('sendReset');button.disabled=true;button.textContent='Sending…';status('');
    try{
      const {error}=await client.auth.resetPasswordForEmail($('email').value.trim(),{
        redirectTo:location.origin+'/set-password.html'
      });
      if(error)throw error;
      status('Password setup email sent. Open it in this same browser and use the secure link to choose a password.');
    }catch(err){status(err.message||'Could not send password setup email.',true);}
    finally{button.disabled=false;button.textContent='Send password setup link';}
  });
  $('passwordForm').addEventListener('submit',async e=>{
    e.preventDefault();
    if(!client)return;
    const password=$('newPassword').value,confirm=$('confirmPassword').value;
    if(password.length<8){status('Password kam se kam 8 characters ka hona chahiye.',true);return;}
    if(password!==confirm){status('Dono passwords match nahi karte.',true);return;}
    const button=$('savePassword');button.disabled=true;button.textContent='Saving…';status('');
    try{
      const {error}=await client.auth.updateUser({password});
      if(error)throw error;
      $('passwordForm').classList.add('hidden');
      status('Password successfully set. Ab Clinic Admin Login par jaakar email aur naye password se login karein.');
    }catch(err){status(err.message||'Could not update password.',true);}
    finally{button.disabled=false;button.textContent='Save password';}
  });
  if(client){
    client.auth.onAuthStateChange((event,session)=>{
      if(session&&(event==='SIGNED_IN'||event==='PASSWORD_RECOVERY'||event==='INITIAL_SESSION'))showPasswordForm(session);
    });
  }
  initialise();
})();
</script>
</body>
</html>
